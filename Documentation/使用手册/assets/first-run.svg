<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560"><rect width="1080" height="560" rx="24" fill="#f1f5f9"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172536}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526477}.label{font-size:22px;font-weight:600}.small{font-size:18px}.note{font-size:16px;fill:#526477}</style><text x="44" y="58" class="title">从安装到首次使用</text><text x="44" y="91" class="sub">建议先验证短会话，再决定是否延长使用。</text><rect x="46" y="125" width="988" height="82" rx="16" fill="white"/><circle cx="87" cy="165" r="23" fill="#203953"/><text x="81" y="172" style="font-size:21px;fill:white">1</text><text x="133" y="159" class="label">安装到应用程序</text><text x="133" y="188" class="note">将 Qiming.app 拖到 Applications</text><rect x="46" y="228" width="988" height="82" rx="16" fill="white"/><circle cx="87" cy="268" r="23" fill="#203953"/><text x="81" y="275" style="font-size:21px;fill:white">2</text><text x="133" y="262" class="label">批准辅助组件</text><text x="133" y="291" class="note">点击配置，按系统提示批准后台运行</text><rect x="46" y="331" width="988" height="82" rx="16" fill="white"/><circle cx="87" cy="371" r="23" fill="#203953"/><text x="81" y="378" style="font-size:21px;fill:white">3</text><text x="133" y="365" class="label">选择时长与策略</text><text x="133" y="394" class="note">首次测试建议短时长，并保存工作</text><rect x="46" y="434" width="988" height="82" rx="16" fill="white"/><circle cx="87" cy="474" r="23" fill="#203953"/><text x="81" y="481" style="font-size:21px;fill:white">4</text><text x="133" y="468" class="label">检查运行与恢复</text><text x="133" y="497" class="note">查看状态；结束后确认恢复正常睡眠</text></svg>