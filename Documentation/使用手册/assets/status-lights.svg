<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570"><rect width="1080" height="570" rx="24" fill="#f1f5f9"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172536}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526477}.label{font-size:22px;font-weight:600}.small{font-size:18px}.note{font-size:16px;fill:#526477}</style><text x="44" y="58" class="title">一眼读懂状态灯</text><text x="44" y="91" class="sub">颜色表示状态类别；悬停看文字，点击看运行与恢复详情。</text><rect x="36" y="124" width="1008" height="91" rx="17" fill="white"/><circle cx="80" cy="170" r="18" fill="#7e8792"/><text x="120" y="162" class="label">灰色 · 待机</text><text x="360" y="159" class="small">跟随系统，无主动保持运行</text><text x="360" y="189" class="note">轻缓呼吸；不是应用未启动</text><rect x="36" y="229" width="1008" height="91" rx="17" fill="white"/><circle cx="80" cy="275" r="18" fill="#249c59"/><text x="120" y="267" class="label">绿色 · 运行</text><text x="360" y="264" class="small">合盖运行 / 始终常亮</text><text x="360" y="294" class="note">手动熄屏后的会话也可能为绿色</text><rect x="36" y="334" width="1008" height="91" rx="17" fill="white"/><circle cx="80" cy="380" r="18" fill="#de8c20"/><text x="120" y="372" class="label">橙色 · 提醒</text><text x="360" y="369" class="small">等待电源、温度或保护提示</text><text x="360" y="399" class="note">提醒时常亮；正常切换保持原色</text><rect x="36" y="439" width="1008" height="91" rx="17" fill="white"/><circle cx="80" cy="485" r="18" fill="#d64545"/><text x="120" y="477" class="label">红色 · 异常</text><text x="360" y="474" class="small">连接中断、操作失败或状态未确认</text><text x="360" y="504" class="note">点击状态灯查看详情，先核对恢复状态</text></svg>