<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650"><rect width="1080" height="650" rx="24" fill="#f1f5f9"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172536}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526477}.label{font-size:22px;font-weight:600}.small{font-size:18px}.note{font-size:16px;fill:#526477}</style><text x="44" y="58" class="title">主面板导览</text><text x="44" y="91" class="sub">布局示意图：用于说明操作位置，不是当前会话的真实截图。</text><rect x="40" y="120" width="380" height="490" rx="26" fill="white" stroke="#c8d3df"/><text x="65" y="164" class="label">Qiming</text><circle cx="292" cy="155" r="7" fill="#7e8792"/><text x="340" y="163" class="label">⏻ ⚙</text><text x="65" y="213" class="note">显示策略</text><rect x="366" y="233" width="34" height="18" rx="9" fill="#1687f8"/><circle cx="391" cy="242" r="7" fill="white"/><text x="65" y="236" class="small">跟随系统</text><text x="65" y="263" class="note">保持 Mac 原有显示与睡眠行为</text><rect x="366" y="296" width="34" height="18" rx="9" fill="#c9d1da"/><circle cx="375" cy="305" r="7" fill="white"/><text x="65" y="299" class="small">合盖熄屏，持续运行</text><text x="65" y="326" class="note">开盖保持内屏常亮；合盖熄屏</text><rect x="366" y="359" width="34" height="18" rx="9" fill="#c9d1da"/><circle cx="375" cy="368" r="7" fill="white"/><text x="65" y="362" class="small">开盖常亮，合盖休眠</text><text x="65" y="389" class="note">合盖后由 macOS 正常休眠</text><rect x="366" y="422" width="34" height="18" rx="9" fill="#c9d1da"/><circle cx="375" cy="431" r="7" fill="white"/><text x="65" y="425" class="small">始终常亮</text><text x="65" y="452" class="note">每次启用前需要确认风险</text><path d="M60 469H400" stroke="#dae2eb"/><text x="65" y="507" class="small">时长：直到手动结束 ▾</text><rect x="60" y="526" width="340" height="40" rx="20" fill="#e9eef4"/><text x="190" y="552" class="small">立即熄屏</text><text x="65" y="592" class="note">状态、结束和退出都在顶部</text><text x="465" y="165" class="label">01　四个独立入口</text><text x="465" y="197" class="note">呼吸灯看状态，回转箭头结束会话。</text><text x="465" y="225" class="note">电源退出，齿轮打开设置。</text><text x="465" y="280" class="label">02　四种策略</text><text x="465" y="312" class="note">右侧开关互斥；关闭运行项恢复跟随系统。</text><text x="465" y="405" class="label">03　时长与操作</text><text x="465" y="437" class="note">时长可更新当前会话，定时会话可延长。</text><text x="465" y="535" class="label">04　状态详情</text><text x="465" y="567" class="note">核对供电、辅助组件、断言与恢复结果。</text></svg>